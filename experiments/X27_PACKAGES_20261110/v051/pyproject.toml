[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x27-causal-continuity-v051"
version = "0.5.1"
description = "Finite oracle/policy/repair/dose reference model for X27 U010"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Research reference implementation; not a physical validation claim" }
dependencies = []

[project.scripts]
x27v051 = "x27v051.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
