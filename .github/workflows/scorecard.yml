name: Development supply-chain scorecard
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'
permissions:
  contents: read
jobs:
  scorecard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supply-chain-scorecard
          path: scorecard.json
          retention-days: 30
