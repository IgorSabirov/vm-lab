name: Research change events
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
jobs:
  retire_obsolete_initial_runs:
    # One-time repair of four known pre-inference runs from before #188.
    # The immutable before SHA makes this job inert on subsequent pushes.
    if: github.repository == 'IgorSabirov/vm-lab' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '21515b7f35337fc3b8154b9075dbc98e5e9b829a'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Retire only the four obsolete runs before model analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          root = 'https://api.github.com/repos/IgorSabirov/vm-lab/'
          headers = {'Accept': 'application/vnd.github+json',
                     'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                     'User-Agent': 'vm-lab-one-time-thematic-repair'}
          def request(path, method='GET'):
              with urllib.request.urlopen(urllib.request.Request(root + path, headers=headers, method=method), timeout=30) as response:
                  data = response.read()
              return json.loads(data) if data else None
          # Pending runs first; this avoids starting another obsolete collector.
          for run_id in (44904749559, 44904708257, 44904467409, 44904417387):
              run = request(f'actions/runs/{run_id}')
              if run['head_sha'] != '1ceacf16078d8f1370d761df9f82c0e03f86614a' or run['path'] != '.github/workflows/copilot-thematic.yml':
                  raise ValueError('Unexpected target identity')
              if run['status'] == 'completed':
                  print(run_id, 'already completed', flush=True)
                  continue
              jobs = request(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
              if any(job['name'] in ('analyze', 'publish') and job['status'] != 'queued' and job.get('conclusion') != 'skipped' for job in jobs):
                  raise ValueError('Refusing to cancel a run that reached model analysis')
              request(f'actions/runs/{run_id}/cancel', 'POST')
              print(run_id, 'cancellation requested before analysis', flush=True)
          PY
  signal:
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve event data without checking out or executing branch code
        env:
          SIGNAL_EVENT: ${{ github.event_name }}
          SIGNAL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path('thematic-event')
          root.mkdir()
          shutil.copyfile(os.environ['GITHUB_EVENT_PATH'], root / 'EVENT.json')
          (root / 'META.json').write_text(json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'source_sha': os.environ['SIGNAL_SOURCE_SHA'],
              'execution_sha': os.environ['GITHUB_SHA'],
              'event_name': os.environ['SIGNAL_EVENT'],
          }))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: research-change-event
          path: thematic-event/
          retention-days: 30
          if-no-files-found: error
