name: R141 full 657-zero replay - direct GitHub Actions
on:
  push:
    branches: [work/r141-zeta-657-actions-direct-20261122]
    paths:
      - reproductions/R141_ZETA_657_20261122/runtime/reproduce.py
      - .github/workflows/r141-zeta-657-actions-direct.yml
permissions:
  contents: read
concurrency:
  group: r141-zeta-657-actions-direct
  cancel-in-progress: false
jobs:
  reproduce:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: reproductions/R141_ZETA_657_20261122
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Run the complete 657-zero experiment directly
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
        run: python reproductions/R141_ZETA_657_20261122/runtime/reproduce.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r141-zeta-657-direct
          path: reproductions/R141_ZETA_657_20261122/runtime/results/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: reproduce
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: reproductions/R141_ZETA_657_20261122
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: r141-zeta-657-direct
          path: reproductions/R141_ZETA_657_20261122/results/${{ github.run_id }}
      - name: Commit all raw results and open a draft PR
        env:
          RUN_NUMBER: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPRO_RESULT: ${{ needs.reproduce.result }}
        run: |
          set -euo pipefail
          root="reproductions/R141_ZETA_657_20261122/results/$RUN_NUMBER"
          mkdir -p "$root"
          if [ -f "$root/MANIFEST.sha256" ]; then (cd "$root" && sha256sum --check MANIFEST.sha256); fi
          printf 'Workflow job result: %s\\nRun: https://github.com/IgorSabirov/vm-lab/actions/runs/%s\\n' "$REPRO_RESULT" "$RUN_NUMBER" > "$root/PUBLICATION_RECEIPT.txt"
          branch="actions/r141-zeta-657-$RUN_NUMBER"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$root"
          git commit -m "Save R141 direct 657-zero replay $RUN_NUMBER"
          git push --set-upstream origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "R141: direct 657-zero Actions replay $RUN_NUMBER" --body "Direct Python execution on GitHub Actions; Copilot not used.\\n\\nWorkflow job: $REPRO_RESULT\\nRun: https://github.com/IgorSabirov/vm-lab/actions/runs/$RUN_NUMBER\\n\\nInspect RUNNER_RECEIPT.json, CHECKS.json, REPORT.md and MANIFEST.sha256. Draft PR publication is not scientific acceptance."
          gh issue comment 209 --body "Direct GitHub Actions R141 replay: https://github.com/IgorSabirov/vm-lab/actions/runs/$RUN_NUMBER ; result publication is in the draft PR. Copilot quota was bypassed by direct fixed-script execution."
