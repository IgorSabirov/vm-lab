name: CodeQL active source
on:
  pull_request:
    paths: ['infra/**/*.py', 'tools/**/*.py', 'experiments/now_integrated_v1/**', '.github/workflows/codeql.yml', '.github/codeql-config.yml']
  push:
    branches: [main]
    paths: ['infra/**/*.py', 'tools/**/*.py', 'experiments/now_integrated_v1/**', '.github/workflows/codeql.yml', '.github/codeql-config.yml']
  schedule:
    - cron: '39 5 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
