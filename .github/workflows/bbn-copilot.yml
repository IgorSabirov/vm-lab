name: BBN and CLASS integrations through native Copilot
on:
  push:
    branches: [work/bbn-copilot-20261120]
    paths: [reproductions/BBN_COSMO_20261120/runtime/**, .github/workflows/bbn-copilot.yml]
permissions:
  contents: read
concurrency:
  group: bbn-copilot-20261120
  cancel-in-progress: false
jobs:
  reproduce:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            reproductions/BBN_COSMO_20261120
            analysis/PRIMAT_LINX_BBN_BRIDGE_20261117
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cgiovanetti/LINX
          ref: bfba07c77a5fcba1cc772d42f2d9e9be8a542df8
          path: vendor/linx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: CyrilPitrou/primat
          ref: 6f7e5680614fb119d65a6c9c65a292240b27c61e
          path: vendor/primat
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lesgourg/class_public
          ref: e85808324f51fc694d12e3ed7439552a3c3f9540
          path: vendor/class
          persist-credentials: false
      - name: Install numerical environment and compile pinned CLASS
        run: |
          python -m pip install -r reproductions/BBN_COSMO_20261120/requirements.lock
          make -C vendor/class -j2 class
      - uses: github/gh-aw/actions/setup@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Install the repository's pinned native Copilot CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
        run: bash "$RUNNER_TEMP/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --cooldown-days 3
      - name: Copilot executes the complete frozen reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/linx:${{ github.workspace }}/vendor/primat
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: 'true'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python reproductions/BBN_COSMO_20261120/runtime/invoke_copilot.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bbn-copilot-reproduction
          path: ${{ runner.temp }}/bbn-copilot-task/results/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: reproduce
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: reproductions/BBN_COSMO_20261120
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bbn-copilot-reproduction
          path: reproductions/BBN_COSMO_20261120/results/${{ github.run_id }}
      - name: Verify artifact manifest and commit all raw results
        env:
          RUN_NUMBER: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPRO_RESULT: ${{ needs.reproduce.result }}
        run: |
          set -euo pipefail
          result_path="reproductions/BBN_COSMO_20261120/results/$RUN_NUMBER"
          (cd "$result_path" && sha256sum --check MANIFEST.sha256)
          branch="copilot/bbn-reproduction-$RUN_NUMBER"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$result_path"
          git commit -m "Save BBN and CLASS Copilot reproduction $RUN_NUMBER and all raw evidence"
          git push --set-upstream origin "$branch"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = os.environ['RUN_NUMBER']
          root = Path('reproductions/BBN_COSMO_20261120/results')/run
          p = root/'EXECUTION_RECEIPT.json'
          receipt = json.loads(p.read_text()) if p.exists() else {'status':'COPILOT_DID_NOT_EXECUTE'}
          body = f"Issue #140. Frozen full BBN and CLASS reproduction through native Copilot CLI.\n\nObserved status: **{receipt['status']}**. Runner job: {os.environ['REPRO_RESULT']}.\n\nRun: https://github.com/IgorSabirov/vm-lab/actions/runs/{run}\n\nAll raw files, code, logs, manifest, comparison and execution/Copilot receipts are committed under `{root}`. Inspect the actual receipts; an opened PR is not a scientific PASS. Original sources and reference data remain intact. Owner retains scientific acceptance.\n"
          Path(os.environ['RUNNER_TEMP'],'bbn-pr-body.md').write_text(body)
          PY
          pr_url=$(gh pr create --draft --base main --head "$branch" --title "BBN and CLASS: Copilot reproduction $RUN_NUMBER and raw results" --body-file "$RUNNER_TEMP/bbn-pr-body.md")
          gh issue comment 140 --body "Native Copilot execution and result publication: $pr_url ; run https://github.com/IgorSabirov/vm-lab/actions/runs/$RUN_NUMBER . Read the committed receipts for the actual outcome."
