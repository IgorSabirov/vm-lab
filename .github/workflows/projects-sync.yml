name: Projects working board
on:
  push:
    branches: [main]
    paths: ['tools/project_sync.py', 'tools/r135_pipeline.py', 'tools/r135_progress.py', 'tools/r135_pipeline_documents.py', 'tools/github_setup.py', 'tools/research_operations.py', 'infra/OPERATIONS.json', 'infra/r135/**', 'infra/external/GITHUB_SETUP.json', '.github/workflows/projects-sync.yml']
  issues:
    types: [opened, reopened, closed, edited, deleted, transferred, labeled, unlabeled]
  workflow_run:
    workflows: [Project events]
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vm-lab-projects
  cancel-in-progress: false
jobs:
  operations:
    if: github.repository == 'IgorSabirov/vm-lab' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/research_operations.py
            infra/OPERATIONS.json
          sparse-checkout-cone-mode: false
      - name: Observe canonical queue and exact-head evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/research_operations.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: research-operations
          path: project-evidence/OPERATIONS_STATUS.*
          if-no-files-found: error
          retention-days: 30
  r135-pipeline:
    if: github.repository == 'IgorSabirov/vm-lab' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.verified-receipt.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Validate R135 delivery map
        run: python3 tools/r135_pipeline.py --check
      - name: Reconcile R135 relationships and evidence for closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/r135_pipeline.py --apply
      - name: Publish the verified revision for the board job
        id: verified-receipt
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          receipt = json.loads(Path('project-evidence/R135_PIPELINE_STATUS.json').read_bytes())
          source = receipt.get('source_sha', '')
          assert receipt.get('verified') is True and re.fullmatch(r'[0-9a-f]{40}', source)
          assert receipt.get('repository') == 'IgorSabirov/vm-lab'
          assert source == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              print('source_sha='+source, file=output)
          PY
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: r135-pipeline-readback
          path: project-evidence/R135_PIPELINE_STATUS.json
          if-no-files-found: warn
          retention-days: 30
  sync:
    needs: r135-pipeline
    if: github.repository == 'IgorSabirov/vm-lab' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.r135-pipeline.outputs.source_sha }}
          persist-credentials: false
      - name: Read the pipeline receipt from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r135-pipeline-readback
          path: project-evidence/pipeline-receipt
      - name: Create, reconcile and read back the working board
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: python3 tools/project_sync.py --apply --pipeline-status project-evidence/pipeline-receipt/R135_PIPELINE_STATUS.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: projects-readback
          path: project-evidence/PROJECTS_STATUS.json
          if-no-files-found: warn
          retention-days: 7
