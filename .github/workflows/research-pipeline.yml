name: Full BBN identity research package
on:
  push:
    branches: ['science/autonomous-bbn-identity-v3-20261115']
    paths: [analysis/CCC_BBN_NETWORK_20261114/pipeline/RUN_REQUEST.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: ccc-bbn-research-pipeline
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'IgorSabirov/vm-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PACKAGE_DIR: analysis/CCC_BBN_NETWORK_20261114/s3_standard/linx_dd_adapter_20261115/full_run_20261115
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate dispatch against the frozen source
        id: select
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          path='analysis/CCC_BBN_NETWORK_20261114/pipeline/RUN_REQUEST.json'
          r=json.load(open(path))
          if not r.get('execution_enabled'):
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute=false\n')
              raise SystemExit(0)
          assert r['id']=='LINX_BBN_IDENTITY_20261115_r2'
          assert r['implementation']=='linx_bbn_identity_v3'
          sha=r['source_commit'];assert re.fullmatch('[0-9a-f]{40}',sha)
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',sha,'HEAD'],text=True).splitlines()
          assert set(changed)=={path},changed
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('execute=true\nsource='+sha+'\n')
          PY
      - name: Isolate frozen source from the publication branch
        if: steps.select.outputs.execute == 'true'
        env:
          SOURCE_SHA: ${{ steps.select.outputs.source }}
        run: |
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add --detach "$RUNNER_TEMP/identity-source" "$SOURCE_SHA"
      - name: Reserve one package and publish calibration admission
        if: steps.select.outputs.execute == 'true'
        id: admission
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.select.outputs.source }}
        run: python "$RUNNER_TEMP/identity-source/$PACKAGE_DIR/run.py" reserve
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: steps.admission.outputs.execute == 'true'
        with:
          python-version: '3.12.16'
      - name: Install frozen dependencies
        if: steps.admission.outputs.execute == 'true'
        timeout-minutes: 10
        run: timeout 600 python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/identity-source/$PACKAGE_DIR/../requirements.lock"
      - name: Materialize pristine and recorded-patch LINX roots
        if: steps.admission.outputs.execute == 'true'
        timeout-minutes: 5
        run: timeout 300 python "$RUNNER_TEMP/identity-source/$PACKAGE_DIR/../identity/materialize_roots.py" "$RUNNER_TEMP/linx-identity-roots"
      - name: Calibrate full route, admit, execute two strict BBN arms and verify
        if: steps.admission.outputs.execute == 'true'
        timeout-minutes: 135
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.select.outputs.source }}
        run: timeout --signal=TERM --kill-after=10 8100 python "$RUNNER_TEMP/identity-source/$PACKAGE_DIR/run.py" execute
      - name: Publish terminal evidence and close reservation
        if: always() && steps.admission.outputs.execute == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.select.outputs.source }}
        run: python "$RUNNER_TEMP/identity-source/$PACKAGE_DIR/run.py" finalize
      - name: Preserve all partial results and admission
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LINX-BBN-identity-${{ github.run_id }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/autonomy-budget.json
            ${{ runner.temp }}/identity-source/analysis/CCC_BBN_NETWORK_20261114/s3_standard/linx_dd_adapter_20261115/full_run_20261115/results/**
