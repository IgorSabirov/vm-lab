name: Copilot repository-native thematic review
on:
  workflow_run:
    workflows: [Research change events]
    types: [completed]
  issues:
    types: [opened, edited, reopened, closed, deleted, transferred, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vm-lab-copilot-thematic
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'IgorSabirov/vm-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect the exact triggering update and reconcile missed GitHub events
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 infra/copilot_thematic_events.py collect --output thematic-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: thematic-event
          path: thematic-output/EVENTS.json
          retention-days: 30
          if-no-files-found: error

  analyze:
    needs: collect
    if: needs.collect.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: thematic-event
          path: thematic-output
      - uses: github/gh-aw/actions/setup@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Install the verified native Copilot CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
        run: bash "$RUNNER_TEMP/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --cooldown-days 3
      - name: Let Copilot explore the checked-out repository itself
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_MAX_AI_CREDITS: '60'
          COPILOT_TIMEOUT_SECONDS: '900'
        run: python3 infra/copilot_thematic_native.py analyze --events thematic-output/EVENTS.json --output thematic-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: thematic-review
          path: |
            thematic-output/EVENTS.json
            thematic-output/REPORT.md
            thematic-output/DELIVERY.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: [collect, analyze]
    if: needs.collect.result == 'success' && needs.analyze.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: thematic-review
          path: thematic-output
      - name: Publish the concise report and delivery receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 infra/copilot_thematic_native.py publish --output thematic-output
