name: External source monitor
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['analysis/FOUR_CANDIDATE_INTEGRATION_20261108/SOURCE_INDEX.json', '.github/workflows/upstream-monitor.yml', 'tools/external_sources.py', 'tools/upstream_pr.mjs']
permissions:
  contents: read
concurrency:
  group: upstream-observations
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'IgorSabirov/vm-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Inspect metadata without executing upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/external_sources.py monitor
      - name: Prepare review PR; never update accepted source pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/upstream_pr.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: upstream-observations
          path: external-evidence/UPSTREAM.*
          retention-days: 30
