name: Copilot six-model review
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: copilot-review-six-models-v1
  cancel-in-progress: false
jobs:
  model_analysis:
    name: Generate model analysis (not scientific acceptance)
    if: github.actor == github.repository_owner && github.event.issue.number == 30 && (github.event.comment.body == '/vm-lab-review six-models-v1' || github.event.comment.body == '/vm-lab-review six-models-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      REVIEW_TASK: ${{ github.event.comment.body == '/vm-lab-review six-models-v2' && 'six-models-v2' || 'six-models-v1' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reuse existing proposal instead of another model call
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const prs=await github.paginate(github.rest.pulls.list,{...context.repo,state:'all',per_page:100});
            if(prs.some(p=>p.head.ref.startsWith(`copilot/review-${process.env.REVIEW_TASK}-`)))
              throw Error('Review proposal already exists; inspect/recover it instead of repeated inference');
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Symbolic check dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0 mpmath==1.3.0
      - name: Prepare exact evidence and bounded existing checks
        id: prepare
        timeout-minutes: 3
        run: python infra/copilot_review.py prepare --task "$REVIEW_TASK"
      - uses: github/gh-aw/actions/setup@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Install reviewed native CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
        run: bash "$RUNNER_TEMP/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --cooldown-days 3
      - name: Native review with no tools or write credentials
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python infra/copilot_review.py generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: six-model-review
          path: review-output/
          retention-days: 30
  context_only:
    name: Build required context (no model call)
    if: github.actor == github.repository_owner && github.event.issue.number == 30 && github.event.comment.body == '/vm-lab-context six-models-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python infra/copilot_review.py context --task six-models-v2 --output context-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: research-context-v2
          path: context-output/
          retention-days: 30
  recover:
    name: Recover saved analysis (no model call)
    if: github.actor == github.repository_owner && github.event.issue.number == 30 && (github.event.comment.body == '/vm-lab-review-recover six-models-v1 43247986127' || github.event.comment.body == '/vm-lab-review-recover six-models-v2 43296750512')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RECOVERY_TASK: ${{ github.event.comment.body == '/vm-lab-review-recover six-models-v2 43296750512' && 'six-models-v2' || 'six-models-v1' }}
    permissions:
      contents: read
      actions: read
    outputs:
      base_sha: ${{ steps.recover.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the original saved response
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ env.RECOVERY_TASK == 'six-models-v2' && '13979631976' || '13957606835' }}
          run-id: ${{ env.RECOVERY_TASK == 'six-models-v2' && '43296750512' || '43247986127' }}
          github-token: ${{ github.token }}
          path: review-output
          merge-multiple: true
      - name: Verify digests and recover without a model call
        id: recover
        run: python infra/copilot_review.py recover --task "$RECOVERY_TASK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: six-model-review
          path: review-output/
          retention-days: 30
  publish:
    needs: [model_analysis, recover]
    if: always() && (needs.model_analysis.result == 'success' || needs.recover.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: six-model-review
          path: proposal
      - name: Publish fixed review files without executing model output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_SHA: ${{ needs.model_analysis.outputs.base_sha || needs.recover.outputs.base_sha }}
        with:
          script: |
            await require('./infra/copilot_publish.cjs').main({github,context,core,mode:'review'});
