name: External contracts reusable validation
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact vm-lab source commit
        required: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require exact identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}",os.environ["SOURCE_SHA"])'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IgorSabirov/vm-lab
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python tools/external_sources.py validate
      - run: python -m unittest discover -s tests -p 'test_external*.py'
      - run: python tools/evidence_compendium.py
