name: S3 D+D local response
on:
  push:
    branches: ['science/autonomous-bbn-identity-v4-20261115']
    paths:
      - analysis/CCC_BBN_NETWORK_20261114/s3_standard/dd_covariance_20261115/RUN_REQUEST.json
permissions:
  contents: write
  actions: read
concurrency:
  group: ccc-bbn-research-pipeline
  cancel-in-progress: false
jobs:
  response:
    if: github.repository == 'IgorSabirov/vm-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PACKAGE_DIR: analysis/CCC_BBN_NETWORK_20261114/s3_standard/dd_covariance_20261115
      ADAPTER_DIR: analysis/CCC_BBN_NETWORK_20261114/s3_standard/linx_dd_adapter_20261115
      SOURCE_SHA: ${{ github.sha }}
      BASE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate frozen source and execution plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          path=Path(os.environ['PACKAGE_DIR'])/'run.py'
          spec=importlib.util.spec_from_file_location('dd_run',path)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.validate_source()
          m.execution_policy.validate(m.PLAN,m.read(m.ROOT/'infra/autonomy/CONTROL.json')['limits'],root=m.ROOT)
          PY
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - name: Install pinned numerical environment
        timeout-minutes: 10
        run: timeout 600 python -m pip install --disable-pip-version-check -r "$ADAPTER_DIR/requirements.lock"
      - name: Admit, run native q0, declare forecast, and execute eight perturbations
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=15 6000 python "$PACKAGE_DIR/run.py"
      - name: Preserve complete or partial results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: S3-DD-response-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: analysis/CCC_BBN_NETWORK_20261114/s3_standard/dd_covariance_20261115/results/**
