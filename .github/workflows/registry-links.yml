name: Registry links
on:
  push:
    paths:
      - 'analysis/NOW_RESULTS_SYNTHESIS_20261106/**'
      - 'analysis/FOUNDATIONS_LITERATURE_20261103/PREMISES_CURRENT.*'
      - 'analysis/REGISTRY_LINKS/**'
      - 'analysis/G3_CONTACT_CAPACITY_20261111/**'
      - 'tools/registry_links.py'
      - 'tests/test_registry_links.py'
      - '.github/workflows/registry-links.yml'
  pull_request:
    paths:
      - 'analysis/NOW_RESULTS_SYNTHESIS_20261106/**'
      - 'analysis/FOUNDATIONS_LITERATURE_20261103/PREMISES_CURRENT.*'
      - 'analysis/REGISTRY_LINKS/**'
      - 'analysis/G3_CONTACT_CAPACITY_20261111/**'
      - 'tools/registry_links.py'
      - 'tests/test_registry_links.py'
      - '.github/workflows/registry-links.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check generated links and mirrors
        run: python3 tools/registry_links.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Test failure detection
        run: python3 -m unittest discover -s tests -p test_registry_links.py
