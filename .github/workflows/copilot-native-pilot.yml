name: Copilot native report pilot
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: copilot-native-report-pilot
  cancel-in-progress: false
jobs:
  generate:
    if: github.actor == github.repository_owner && github.event.issue.number == 16 && github.event.comment.body == '/vm-lab-native-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Do not duplicate an existing proposal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const prs=await github.paginate(github.rest.pulls.list,{...context.repo,state:'open',per_page:100});
            if(prs.some(p=>p.head.ref.startsWith('copilot/native-pilot-')))
              throw Error('Native pilot PR already exists; review that result instead of repeating inference');
      - name: Prepare pinned evidence and run deterministic checks
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python infra/copilot_native_pilot.py prepare
      - uses: github/gh-aw/actions/setup@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Install reviewed native CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
        run: bash "$RUNNER_TEMP/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --cooldown-days 3
      - name: Native Auto report, no tools or publication credentials
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python infra/copilot_native_pilot.py generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-pilot-proposal
          path: |
            native-context.json
            native-proposal.json
            native-failure.json
          retention-days: 7
  publish:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-pilot-proposal
          path: proposal
      - name: Publish only fixed report paths, never execute model output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_SHA: ${{ needs.generate.outputs.base_sha }}
        with:
          script: |
            await require('./infra/copilot_publish.cjs').main({github,context,core,mode:'generated'});
  publish-saved:
    if: github.actor == github.repository_owner && github.event.issue.number == 16 && github.event.comment.body == '/vm-lab-native-publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish receipt from the saved report without invoking Copilot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          script: |
            await require('./infra/copilot_publish.cjs').main({github,context,core,mode:'saved'});
