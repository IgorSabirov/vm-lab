name: Copilot native report pilot
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: copilot-native-report-pilot
  cancel-in-progress: false
jobs:
  generate:
    if: github.actor == github.repository_owner && github.event.issue.number == 16 && github.event.comment.body == '/vm-lab-native-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Do not duplicate an existing proposal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const prs=await github.paginate(github.rest.pulls.list,{...context.repo,state:'open',per_page:100});
            if(prs.some(p=>p.head.ref.startsWith('copilot/native-pilot-')))
              throw Error('Native pilot PR already exists; review that result instead of repeating inference');
      - name: Prepare pinned evidence and run deterministic checks
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python infra/copilot_native_pilot.py prepare
      - uses: github/gh-aw/actions/setup@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Install reviewed native CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
        run: bash "$RUNNER_TEMP/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --cooldown-days 3
      - name: Native Auto report, no tools or publication credentials
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python infra/copilot_native_pilot.py generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-pilot-proposal
          path: |
            native-context.json
            native-proposal.json
            native-failure.json
          retention-days: 7
  publish:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-pilot-proposal
          path: proposal
      - name: Publish only fixed report paths, never execute model output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_SHA: ${{ needs.generate.outputs.base_sha }}
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const raw=fs.readFileSync('proposal/native-proposal.json','utf8');
            if(Buffer.byteLength(raw)>50000)throw Error('Oversized proposal');
            const d=JSON.parse(raw),base=process.env.EXPECTED_SHA;
            if(!/^[a-f0-9]{40}$/.test(base)||d.source_sha!==base||d.receipt.source_sha!==base)
              throw Error('Source identity mismatch');
            if(d.receipt.status!=='NATIVE_REPORT_GENERATED'||d.receipt.returncode!==0||d.receipt.timed_out)
              throw Error('No successful generation');
            if(typeof d.report!=='string'||Buffer.byteLength(d.report)<500||Buffer.byteLength(d.report)>35000)
              throw Error('Invalid report');
            if(/(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]+/.test(raw))throw Error('Credential-shaped output');
            if(crypto.createHash('sha256').update(d.report).digest('hex')!==d.receipt.report_sha256)
              throw Error('Report digest mismatch');
            const {owner,repo}=context.repo,branch=`copilot/native-pilot-${context.runId}`;
            const commit=await github.rest.git.getCommit({owner,repo,commit_sha:base});
            const tree=await github.rest.git.createTree({owner,repo,base_tree:commit.data.tree.sha,tree:[
              {path:'infra/copilot/reports/FIRST_PILOT.md',mode:'100644',type:'blob',content:d.report},
              {path:'infra/copilot/reports/FIRST_PILOT_RECEIPT.json',mode:'100644',type:'blob',content:JSON.stringify(d.receipt,null,2)+'\n'}
            ]});
            const created=await github.rest.git.createCommit({owner,repo,message:'Copilot native pilot: review existing IsingCauset registry links',tree:tree.data.sha,parents:[base]});
            await github.rest.git.createRef({owner,repo,ref:`refs/heads/${branch}`,sha:created.data.sha});
            const run=`https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const pr=await github.rest.pulls.create({owner,repo,head:branch,base:'main',draft:true,
              title:'[Copilot] IsingCauset: first native report and existing registry links',
              body:`Related #16. Copilot authored the report from pinned source data via native Auto. Trusted Actions steps gathered evidence, ran checks and published these two fixed report files. No model execution tools, registry edits, science acceptance or VM use.\n\nBase: ${base}\nRun: ${run}\n\nReview the report; a successful pipeline is not scientific acceptance.`});
            core.info(pr.data.html_url);
            await core.summary.addLink('Copilot draft PR',pr.data.html_url).write();
