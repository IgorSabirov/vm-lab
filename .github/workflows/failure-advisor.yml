name: CI failure advisor
on:
  workflow_run:
    workflows: ['Development checks']
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
concurrency:
  group: failure-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/ci_failure_report.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./tools/ci_failure_report.cjs')({github, context, core});
