name: Development checks
on:
  pull_request:
  push:
    branches: [main, 'results/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            python3 tools/ci_plan.py --all --output "$GITHUB_OUTPUT"
          else
            python3 tools/ci_plan.py --base "$BASE_SHA" --output "$GITHUB_OUTPUT"
          fi
  tests:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: test-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Numerical dependencies
        if: matrix.numerical
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Workflow parser
        if: matrix.suite == 'integrity'
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run explicit active suite
        env:
          SUITE: ${{ matrix.suite }}
        run: python tools/ci_suite.py "$SUITE"
      - name: Execution summary
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf 'Suite: `%s`; technical execution: **%s**. No scientific status is assigned.\n' "$SUITE" "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
  external-contracts:
    uses: ./.github/workflows/external-validation.yml
    with:
      source_sha: ${{ github.sha }}
  merge-gate:
    if: always()
    needs: [plan, tests, external-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.tests.result }}
          EXTERNAL: ${{ needs.external-contracts.result }}
        run: |
          test "$PLAN" = success && test "$TESTS" = success && test "$EXTERNAL" = success
