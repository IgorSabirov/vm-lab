name: Copilot integration request R2
on:
  push:
    branches: [copilot/integration-r2-20261115]
    paths: [infra/copilot/requests/six-model-integration-r2-20261115/REQUEST.json]
permissions:
  contents: read
concurrency:
  group: copilot-integration-request-r2-20261115
  cancel-in-progress: false
jobs:
  analysis:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse a second workflow invocation for this request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{
              ...context.repo,branch:'copilot/integration-r2-20261115',event:'push',per_page:100});
            if(runs.some(r=>r.path==='.github/workflows/copilot-integration-r2.yml' && Number(r.id)<Number(context.runId)))
              throw Error('Request already had a workflow: inspect/recover it; no automatic inference retry');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify frozen context without model or scientific computation
        run: python infra/copilot/requests/six-model-integration-r2-20261115/run.py verify
      - uses: github/gh-aw/actions/setup@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Install the existing pinned native CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
        run: bash "$RUNNER_TEMP/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --cooldown-days 3
      - name: One native Auto response; no tools, write credentials or retries
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python infra/copilot/requests/six-model-integration-r2-20261115/run.py generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: integration-r2-response
          path: integration-output/
          retention-days: 30
  publish:
    needs: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: integration-r2-response
          path: proposal
      - name: Publish fixed report files using the existing publisher
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs=require('node:fs');
            const crypto=require('node:crypto');
            const publisher=require('./infra/copilot_publish.cjs');
            const proposal=JSON.parse(fs.readFileSync('proposal/native-proposal.json','utf8'));
            publisher.validateProposal(proposal,context.sha);
            if(proposal.receipt.task_id!=='six-model-integration-r2-20261115' ||
               proposal.receipt.scientific_acceptance!==false || proposal.receipt.automatic_retry!==false)
              throw Error('Unexpected request or authority');
            const raw=fs.readFileSync('proposal/RAW_RESPONSE.txt','utf8');
            if(crypto.createHash('sha256').update(raw).digest('hex')!==proposal.receipt.response_sha256)
              throw Error('Response hash mismatch');
            const prefix='infra/copilot/reports/six-model-integration-r2-20261115/';
            const files=[['REPORT.md',proposal.report],['RAW_RESPONSE.txt',raw],
              ['RECEIPT.json',JSON.stringify(proposal.receipt,null,2)+'\n']]
              .map(([name,content])=>({path:prefix+name,mode:'100644',type:'blob',content}));
            const pr=await publisher.ensurePullRequest({github,...context.repo,base:context.sha,
              branch:`copilot/integration-r2-result-${context.runId}`,files,
              title:'[Copilot] Six-model integration and research automation: revised proposal',
              body:`Related #58; preserves failed attempt #60. One authorized native Auto response with pinned context, including unmerged #61. No scientific computations or acceptance, no registry/control changes, no merge.\n\nRequest source: ${context.sha}\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis draft includes the single-request launcher and its frozen inputs for reproducibility. The launcher only reacts to its named request branch, never to science branches or a schedule.`});
            core.info(pr.html_url);
            await core.summary.addLink('Copilot proposal',pr.html_url).write();
