name: R141 full 657-zero replay through native Copilot
on:
  push:
    branches: [work/r141-zeta-657-copilot-20261122]
    paths:
      - reproductions/R141_ZETA_657_20261122/**
      - .github/workflows/r141-zeta-657-copilot.yml
permissions:
  contents: read
concurrency:
  group: r141-zeta-657-copilot
  cancel-in-progress: false
jobs:
  reproduce:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: reproductions/R141_ZETA_657_20261122
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - uses: github/gh-aw/actions/setup@399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Install repository-pinned native Copilot CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
        run: bash "$RUNNER_TEMP/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --cooldown-days 3
      - name: Copilot executes the complete fixed R141 replay
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python reproductions/R141_ZETA_657_20261122/runtime/invoke_copilot.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r141-zeta-657-replay
          path: ${{ runner.temp }}/r141-zeta-task/results/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: reproduce
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: reproductions/R141_ZETA_657_20261122
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: r141-zeta-657-replay
          path: reproductions/R141_ZETA_657_20261122/results/${{ github.run_id }}
      - name: Commit all raw results and open a draft PR
        env:
          RUN_NUMBER: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPRO_RESULT: ${{ needs.reproduce.result }}
        run: |
          set -euo pipefail
          root="reproductions/R141_ZETA_657_20261122/results/$RUN_NUMBER"
          mkdir -p "$root"
          if [ -f "$root/MANIFEST.sha256" ]; then (cd "$root" && sha256sum --check MANIFEST.sha256); fi
          printf 'Workflow job result: %s\nRun: https://github.com/IgorSabirov/vm-lab/actions/runs/%s\n' "$REPRO_RESULT" "$RUN_NUMBER" > "$root/PUBLICATION_RECEIPT.txt"
          branch="copilot/r141-zeta-657-$RUN_NUMBER"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$root"
          git commit -m "Save R141 657-zero Copilot replay $RUN_NUMBER"
          git push --set-upstream origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "R141: full 657-zero Copilot replay $RUN_NUMBER" --body "Owner-authorized fixed replay through native Copilot CLI and dedicated MCP tools.\n\nWorkflow job: $REPRO_RESULT\nRun: https://github.com/IgorSabirov/vm-lab/actions/runs/$RUN_NUMBER\n\nRaw zeros, calculations, logs, checks, environment and hashes are committed under $root. Inspect CHECKS.json and receipts. A draft PR is publication, not scientific acceptance."
          gh issue comment 209 --body "R141 657-zero replay run: https://github.com/IgorSabirov/vm-lab/actions/runs/$RUN_NUMBER ; publication branch: $branch. Inspect the draft PR and committed receipts for actual calculation status."
