name: P2 FULLNET explicit execution
on:
  push:
    branches: [s0-fullnet]
    paths: [analysis/CCC_BBN_NETWORK_20261114/p2_fullnet/RUN_REQUEST.json]
permissions:
  contents: write
concurrency:
  group: p2-fullnet-explicit-execution
  cancel-in-progress: false
jobs:
  fullnet:
    if: github.repository == 'IgorSabirov/vm-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select exact requested branch source
        run: |
          git checkout -B s0-fullnet "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CyrilPitrou/PRIMAT
          ref: 6f7e5680614fb119d65a6c9c65a292240b27c61e
          path: upstream-primat
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical environment
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 threadpoolctl==3.6.0
      - name: Calibrate, publish admission, run strict cold and warm
        run: python analysis/CCC_BBN_NETWORK_20261114/p2_fullnet/cloud_run.py --upstream "$GITHUB_WORKSPACE/upstream-primat"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: P2-FULLNET-${{ github.run_id }}
          retention-days: 90
          path: |
            analysis/CCC_BBN_NETWORK_20261114/p2_fullnet/results/P2_GHA_20261114_r1/**
            !analysis/CCC_BBN_NETWORK_20261114/p2_fullnet/results/P2_GHA_20261114_r1/cache_*/**
            !analysis/CCC_BBN_NETWORK_20261114/p2_fullnet/results/P2_GHA_20261114_r1/runs/*/SOLVER_*.pkl*
