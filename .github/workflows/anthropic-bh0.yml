name: Anthropic BH0 barrier evidence
on:
  push:
    branches: [main]
    paths:
      - analysis/ANTHROPIC_BH0_BARRIER_20261114/**
      - .github/workflows/anthropic-bh0.yml
      - analysis/CCC_BBN_NETWORK_20261114/pipeline/PIPELINE.json
      - infra/research_pipeline.py
  pull_request:
    paths:
      - analysis/ANTHROPIC_BH0_BARRIER_20261114/**
      - .github/workflows/anthropic-bh0.yml
      - analysis/CCC_BBN_NETWORK_20261114/pipeline/PIPELINE.json
      - infra/research_pipeline.py
permissions:
  contents: read
concurrency:
  group: bh0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - run: python -m pip install mpmath==1.3.0
      - name: Verify hashes and independently replay the scalar diagnostic
        run: |
          set -o pipefail
          python analysis/ANTHROPIC_BH0_BARRIER_20261114/verify.py --recompute | tee bh0-check.log
      - name: Check integration with the common pipeline
        run: |
          python - <<'PY'
          import json
          from infra.research_pipeline import read, PKG, evaluate
          state = evaluate(read(PKG/'PIPELINE.json'), read(PKG/'RUN_REQUEST.json'))
          assert state['stages']['BH0']['status'] == 'COMPLETE', state['stages']['BH0']
          print(json.dumps(state['stages']['BH0']))
          PY
      - name: Preserve verification log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: BH0-verification-${{ github.run_id }}
          path: bh0-check.log
          retention-days: 90
