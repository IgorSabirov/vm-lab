[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vm-lab-r135"
version = "0.1.0"
description = "R135 staged physical-sector numerical software"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2"]

[project.scripts]
r135-stage = "r135.cli:main"

[tool.setuptools.packages.find]
include = ["r135*", "donors*"]
